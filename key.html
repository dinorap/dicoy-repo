<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCAM — Tạo Key Kích Hoạt</title>
<style>
  :root{color-scheme:dark;--bg:#0b0d12;--card:#151924;--line:#232a3a;--mut:#8b93a7;--acc:#8ab4ff;--green:#7ce38b;--red:#ff8a8a}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:#e7e9ee;margin:0;padding:24px 16px 60px;line-height:1.6}
  .wrap{max-width:540px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  h1{font-size:1.35rem;margin:0 0 6px}
  p.sub{color:var(--mut);font-size:.9rem;margin:0 0 18px}
  label{display:block;font-size:.88rem;color:#c7cdda;margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2b3550;
        background:#0f1320;color:#fff;font-size:.95rem;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--acc)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .preset{background:#1b2438;border:1px solid #2b3550;color:#9fb3ff;border-radius:8px;
          padding:6px 12px;font-size:.84rem;cursor:pointer}
  .preset:hover{background:#24314d}
  button.primary{width:100%;padding:12px;border-radius:10px;border:none;background:#2c52b3;
                 color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button.primary:hover{background:#3663d6}
  .out{margin-top:18px;padding:14px;background:#0f1320;border:1px dashed #3550a0;border-radius:10px;display:none}
  .out.show{display:block}
  .key-val{font-family:monospace;font-size:1.25rem;color:var(--green);font-weight:700;
           letter-spacing:1px;word-break:break-all;margin:6px 0}
  .copy-btn{background:#22305a;border:1px solid #3550a0;color:#cfe0ff;border-radius:8px;
            padding:7px 14px;font-size:.85rem;cursor:pointer;margin-top:6px}
  .err{color:var(--red);font-size:.86rem;margin:-6px 0 12px;display:none}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.84rem;color:var(--mut)}
  .top-bar a{color:var(--acc);text-decoration:none}
  .logout{background:none;border:none;color:var(--mut);cursor:pointer;font-size:.84rem;padding:0;text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="index.html">← Trang chủ VCAM</a>
    <button id="logoutBtn" class="logout hidden" onclick="logout()">Đăng xuất Admin</button>
  </div>

  <!-- Login screen -->
  <div class="card" id="loginCard">
    <h1>🔒 Đăng nhập Admin</h1>
    <p class="sub">Nhập mật khẩu quản trị để truy cập công cụ tạo Key VCAM.</p>
    <label for="adminPass">Mật khẩu Admin</label>
    <input id="adminPass" type="password" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="loginErr">Mật khẩu không đúng!</div>
    <button class="primary" onclick="login()">Mở khóa</button>
  </div>

  <!-- Keygen screen -->
  <div class="card hidden" id="genCard">
    <h1>🔑 Tạo Key VCAM</h1>
    <p class="sub">Nhập Mã máy từ iPhone khách (hoặc mở trực tiếp link khách gửi) để tạo Key kích hoạt.</p>

    <label for="devid">Mã máy của khách (VD: A3F9-8B2C hoặc A3F98B2C)</label>
    <input id="devid" type="text" placeholder="Nhập 8 ký tự mã máy..." autocomplete="off">

    <label>Chọn nhanh thời hạn</label>
    <div class="btns">
      <button type="button" class="preset" onclick="setDays(1)">Test 1 ngày</button>
      <button type="button" class="preset" onclick="setDays(7)">7 ngày</button>
      <button type="button" class="preset" onclick="setDays(30)">30 ngày</button>
      <button type="button" class="preset" onclick="setDays(365)">1 năm</button>
      <button type="button" class="preset" onclick="setForever()">Vĩnh viễn</button>
    </div>

    <label for="expiry">Ngày hết hạn (YYYY-MM-DD)</label>
    <input id="expiry" type="date">

    <button class="primary" onclick="generateKey()">Tạo Key kích hoạt</button>

    <div class="out" id="outBox">
      <div style="font-size:.85rem;color:#8b93a7">Key kích hoạt cho máy <b id="outDev"></b> (hạn <b id="outExp"></b>):</div>
      <div class="key-val" id="outKey"></div>
      <button class="copy-btn" onclick="copyKey(this)">Sao chép Key</button>
    </div>
  </div>
</div>

<script>
// SHA-256 of default admin password "admin123"
const ADMIN_PASS_HASH = "240BE518FABD2724DDB6F04EEB1DA5967448D7E831C08C8FA822809F74C720A9";
const SECRET_SALT = "DiCoyVCAM#2026!SecretKey";
const AUTH_STORAGE_KEY = "dicoy_admin_auth_v1";

function sha256(ascii) {
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length';
  var i, j, result = '';
  var words = [], asciiBitLength = ascii[lengthProperty]*8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k[lengthProperty];
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty]%64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j>>8) return;
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e&hash[5])^((~e)&hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10)))|0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i]>>(j*8))&255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result.toUpperCase();
}

function showGenUI() {
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('genCard').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');

  const params = new URLSearchParams(location.search);
  const idParam = params.get('id');
  if (idParam) {
    const clean = idParam.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
    if (clean.length === 8) {
      document.getElementById('devid').value = clean.slice(0,4) + '-' + clean.slice(4);
      generateKey();
    }
  }
}

function login() {
  const pass = document.getElementById('adminPass').value;
  if (sha256(pass) === ADMIN_PASS_HASH) {
    localStorage.setItem(AUTH_STORAGE_KEY, ADMIN_PASS_HASH);
    document.getElementById('loginErr').style.display = 'none';
    showGenUI();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem(AUTH_STORAGE_KEY);
  location.reload();
}

function setDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  document.getElementById('expiry').value = d.toISOString().slice(0, 10);
}
function setForever() {
  document.getElementById('expiry').value = "2099-12-31";
}
setDays(7);

function generateKey() {
  const rawDev = document.getElementById('devid').value.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
  if (rawDev.length !== 8) {
    alert("Mã máy phải gồm đúng 8 ký tự (VD: A3F9-8B2C)");
    return;
  }
  const expVal = document.getElementById('expiry').value;
  if (!expVal) { alert("Vui lòng chọn ngày hết hạn"); return; }
  const expStr = expVal.replace(/-/g, '');
  const payload = rawDev + ":" + expStr + ":" + SECRET_SALT;
  const sig = sha256(payload).slice(0, 8);
  const fullKey = expStr + "-" + sig;

  document.getElementById('outDev').textContent = rawDev.slice(0,4) + "-" + rawDev.slice(4);
  document.getElementById('outExp').textContent = (expStr === "20991231") ? "Vĩnh viễn" : expVal;
  document.getElementById('outKey').textContent = fullKey;
  document.getElementById('outBox').classList.add('show');
}

function copyKey(btn) {
  const key = document.getElementById('outKey').textContent;
  navigator.clipboard.writeText(key).then(() => {
    btn.textContent = "Đã copy ✓";
    setTimeout(() => btn.textContent = "Sao chép Key", 1500);
  });
}

if (localStorage.getItem(AUTH_STORAGE_KEY) === ADMIN_PASS_HASH) {
  showGenUI();
}
</script>
</body>
</html>
