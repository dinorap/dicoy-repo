name: build-keyguard

on:
  push:
    paths:
      - 'src/DiCoyKeyGuard/**'
      - '.github/workflows/build-keyguard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDK on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 dpkg-dev xz-utils
          git clone --depth=1 --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks $HOME/theos/toolchain
          curl -sL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1 "sdks-master/iPhoneOS16.5.sdk"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C $HOME/theos/toolchain/
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid && chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Build DiCoyKeyGuard rootless deb
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          cd src/DiCoyKeyGuard
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../../debs
          rm -f ../../debs/com.dicoy.keyguard_*.deb
          cp packages/*.deb ../../debs/

      - name: Regenerate Packages and Release
        run: |
          dpkg-scanpackages debs /dev/null > Packages 2>/dev/null
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          {
            echo "Origin: DiCoy Local"
            echo "Label: DiCoy Local"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: VCAM local builds for iPhone 7 / iOS 15 (rootless)"
            echo "Date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')"
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do
              printf " %s %s %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(wc -c < "$f" | tr -d ' ')" "$f"
            done
          } > Release

      - name: Commit built deb and repo index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs/ Packages Packages.gz Packages.bz2 Release
          if ! git diff --cached --quiet; then
            git commit -m "Build VCAM KeyGuard deb via GitHub Actions"
            git push
          fi
