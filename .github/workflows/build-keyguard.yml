name: build-keyguard

on:
  push:
    paths:
      - 'src/DiCoyKeyGuard/**'
      - '.github/workflows/build-keyguard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          cache: true

      - name: Build DiCoyKeyGuard rootless deb
        run: |
          cd src/DiCoyKeyGuard
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../../debs
          rm -f ../../debs/com.dicoy.keyguard_*.deb
          cp packages/*.deb ../../debs/

      - name: Regenerate Packages and Release
        run: |
          dpkg-scanpackages debs /dev/null > Packages 2>/dev/null
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          {
            echo "Origin: DiCoy Local"
            echo "Label: DiCoy Local"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: VCAM local builds for iPhone 7 / iOS 15 (rootless)"
            echo "Date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')"
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do
              printf " %s %s %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(wc -c < "$f" | tr -d ' ')" "$f"
            done
          } > Release

      - name: Commit built deb and repo index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs/ Packages Packages.gz Packages.bz2 Release
          if ! git diff --cached --quiet; then
            git commit -m "Build VCAM KeyGuard deb via GitHub Actions"
            git push
          fi
